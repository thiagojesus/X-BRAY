name: Weekly independent source audit

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xbray-weekly-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Probe sources and compare production snapshot
        id: audit
        continue-on-error: true
        env:
          XBRAY_API_URL: ${{ secrets.XBRAY_API_URL }}
          XBRAY_REFRESH_TOKEN: ${{ secrets.XBRAY_REFRESH_TOKEN }}
          PYTHONPATH: backend
        run: python -m source_audit.cli

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbray-weekly-source-audit
          path: |
            source-audit-report.json
            source-audit-report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Synchronize audit issue
        if: always()
        uses: actions/github-script@v7
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[X-BRAY] Weekly independent source audit';
            const marker = '<!-- xbray-weekly-source-audit -->';
            let report;
            try {
              report = JSON.parse(fs.readFileSync('source-audit-report.json', 'utf8'));
            } catch {
              report = { status: 'degraded', coverage: { complete: false }, error_code: 'report_missing' };
            }
            const healthy = process.env.AUDIT_OUTCOME === 'success' && report.status === 'healthy' && report.coverage?.complete === true;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100,
            });
            const matches = issues.filter(issue => !issue.pull_request && issue.title === title);
            const openMatches = matches.filter(issue => issue.state === 'open');
            if (!healthy) {
              const details = JSON.stringify(report, null, 2).replaceAll('`', '\\u0060').slice(0, 55000);
              const body = `${marker}\nAudit result: **degraded**. Review each environment's probe result: a verified database comparison with a transport warning is not evidence that both environments are healthy; valid-source disagreement, comparison discrepancies, or incomplete coverage require investigation.\n\n\`\`\`json\n${details}\n\`\`\``;
              const target = openMatches[0] ?? matches[0];
              if (target) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: target.number, body, state: 'open' });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              }
              for (const duplicate of openMatches.slice(1)) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: duplicate.number, state: 'closed', state_reason: 'completed' });
              }
            } else {
              for (const existing of openMatches) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
              }
            }

      - name: Fail when audit is degraded
        if: steps.audit.outcome == 'failure'
        run: exit 1
