name: Refresh and monitor X-BRAY data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Existing backend refresh run ID to resume (leave blank to start a new refresh)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: xbray-daily-refresh
  cancel-in-progress: false

jobs:
  refresh-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend runtime dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Refresh and check production datasets
        id: health
        continue-on-error: true
        env:
          XBRAY_API_URL: ${{ secrets.XBRAY_API_URL }}
          XBRAY_REFRESH_TOKEN: ${{ secrets.XBRAY_REFRESH_TOKEN }}
          XBRAY_REFRESH_RUN_ID: ${{ inputs.resume_run_id || github.run_id }}
          XBRAY_RESUME_EXISTING: ${{ inputs.resume_run_id != '' }}
        run: python3 backend/healthcheck.py --refresh --output health-report.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xbray-health-report
          path: health-report.json
          if-no-files-found: error

      - name: Synchronize incident issue
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[X-BRAY] Production data health check failed';
            const marker = '<!-- xbray-data-health -->';
            const report = fs.existsSync('health-report.json')
              ? JSON.parse(fs.readFileSync('health-report.json', 'utf8'))
              : {
                  status: 'error',
                  failures: ['health report unavailable; inspect workflow logs'],
                  workflow_run: `${context.server}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                };
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (process.env.HEALTH_OUTCOME === 'failure') {
              const details = JSON.stringify(report, null, 2).slice(0, 60000);
              const body = `${marker}\nThe scheduled production refresh or health check failed.\n\n\`\`\`json\n${details}\n\`\`\``;
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail when production health is degraded
        if: steps.health.outcome == 'failure'
        run: exit 1
